name: Docker Build Check

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-container:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Создаем локальные заглушки, чтобы COPY . print/ внутри Dockerfile не тащил лишний мусор
    - name: Create local cmake stubs
      run: |
        mkdir -p cmake
        echo "macro(HunterGate)" > cmake/HunterGate.cmake
        echo "endmacro()" >> cmake/HunterGate.cmake
        echo "macro(hunter_add_package)" >> cmake/HunterGate.cmake
        echo "endmacro()" >> cmake/HunterGate.cmake
        echo "macro(hunter_client)" >> cmake/HunterGate.cmake
        echo "endmacro()" >> cmake/HunterGate.cmake
        > cmake/GTestConfig.cmake

    # Самый главный шаг: проверяем, что наш Dockerfile успешно собирается в образ
    - name: Build Docker Image
      run: docker build -t logger .

    # Проверяем, что образ запускается, принимает данные и корректно работает
    - name: Test Docker Container Run
      run: |
        mkdir -p logs
        docker run -it -v "$(pwd)/logs/:/home/logs/" logger <<INNER_EOF
        test_line_1
        test_line_2
        INNER_EOF
        cat logs/log.txt
