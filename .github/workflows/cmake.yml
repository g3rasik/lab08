name: CMake Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    name: ${{ matrix.os }} with ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: clang
          - os: windows-latest
            compiler: msvc

    steps:
    - uses: actions/checkout@v4

    # Установка и ручная компиляция GTest только для ОС Ubuntu (Linux)
    - name: Install GTest (Ubuntu)
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtest-dev cmake
        cd /usr/src/gtest
        sudo cmake .
        sudo cmake --build .
        sudo cp *.a /usr/lib

    # Создание фейковых заглушек Hunter, чтобы CMake не падал на Windows/Linux в CI
    - name: Create Hunter Stubs
      run: |
        mkdir -p cmake
        echo "macro(HunterGate)" > cmake/HunterGate.cmake
        echo "endmacro()" >> cmake/HunterGate.cmake
        echo "macro(hunter_add_package)" >> cmake/HunterGate.cmake
        echo "endmacro()" >> cmake/HunterGate.cmake
        echo "macro(hunter_client)" >> cmake/HunterGate.cmake
        echo "endmacro()" >> cmake/HunterGate.cmake
        echo "" > cmake/GTestConfig.cmake

    # Конфигурация проекта с передачей пути к заглушкам
    - name: Configure CMake
      run: cmake -S . -B _build -DCMAKE_INSTALL_PREFIX=_install -DHUNTER_ENABLED=OFF -DGTest_DIR=./cmake

    # Сборка проекта
    - name: Build
      run: cmake --build _build --config Release
